[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "timonel"
version = "0.2.0"
description = "Route coding tasks to the right CLI agent and model, escalate on failure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "EduMayMar" }]
keywords = ["ai", "agents", "router", "claude-code", "codex", "copilot", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0.36",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
    "playwright>=1.45",
    "distlib>=0.3.8; sys_platform == 'win32'",
]

[project.scripts]
timonel = "timonel.cli:main"

[project.urls]
Homepage = "https://github.com/EduMayMar/Timonel"
Issues = "https://github.com/EduMayMar/Timonel/issues"
Changelog = "https://github.com/EduMayMar/Timonel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/timonel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PTH", "C4", "PIE", "RET", "ERA"]
ignore = ["S603", "S607", "S404", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PTH", "RUF012", "RUF043", "RUF059", "S606"]
"src/timonel/providers.py" = ["S310"]
"src/timonel/notify.py" = ["S310"]
"src/timonel/wizard.py" = ["S310"]
"src/timonel/commands.py" = ["S310"]
"src/timonel/ledger.py" = ["S608"]
"scripts/terminal_screenshots.py" = ["S606"]
"src/timonel/config.py" = ["S105"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/timonel", "scripts"]

[[tool.mypy.overrides]]
module = ["winpty", "winpty.*", "keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 300
markers = ["e2e: browser tests with Playwright"]

[tool.coverage.run]
source = ["timonel"]
branch = true
omit = ["*/timonel/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
