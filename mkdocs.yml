site_name: Timonel
site_description: Route coding tasks to the right CLI agent and model, escalate on failure.
site_url: https://edumaymar.github.io/Timonel/
repo_url: https://github.com/EduMayMar/Timonel
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quickstart.md
      - Terminal home screen: terminal.md
      - Inicio rápido (es): quickstart.es.md
      - Windows: install/windows.md
      - macOS: install/macos.md
      - Linux: install/linux.md
  - Using Timonel:
      - Concepts: concepts.md
      - Configuration: configuration.md
      - Recipes: recipes.md
      - Connectors: connectors.md
      - Agents in detail: agents.md
  - Reference:
      - Configuration (en): reference/configuration.md
      - Configuración (es): reference/configuration.es.md
      - Configuração (pt): reference/configuration.pt.md
      - Error codes: errors.md
      - routes.yaml (legacy keys): routes-reference.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - Project:
      - Security and privacy: security.md
      - Limits and terms: limits-and-terms.md
      - Adding an agent: adding-an-agent.md
      - Translating: translating.md
      - Versioning: versioning.md
