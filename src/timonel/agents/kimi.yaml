name: kimi
kind: agent
title: Kimi Code CLI
vendor: Moonshot AI
homepage: https://moonshotai.github.io/kimi-code/
verification: {status: verified, version: 2.4.1, date: "2026-11-03", source: "kimi --help (npm @moonshot-ai/kimi-code); kimi command reference"}
install:
  approx_size_mb: 55
  npm: ["npm", "install", "-g", "@moonshot-ai/kimi-code"]
  pnpm: ["pnpm", "add", "-g", "@moonshot-ai/kimi-code"]
  uninstall: {npm: ["npm", "uninstall", "-g", "@moonshot-ai/kimi-code"], pnpm: ["pnpm", "remove", "-g", "@moonshot-ai/kimi-code"]}
  drift: {npm: "@moonshot-ai/kimi-code", help: [["--help"]]}
login: {command: ["kimi", "login"], flow: device}
agent:
  enabled: false
  command: kimi
  billing: subscription
  parser: text
  prompt_via: arg
  supports_read_only: false
  base_args: ["--output-format", "text"]
  model_args: ["--model", "{model}"]
  prompt_args: ["--prompt", "{prompt}"]
  detect: {version: ["--version"]}
