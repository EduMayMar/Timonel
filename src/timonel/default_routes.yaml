version: 1

agents:
  claude:
    command: claude
    billing: subscription
    verified: true
    parser: json
    prompt_via: stdin
    base_args: ["-p", "--output-format", "json", "--permission-prompts", "none", "--no-session-persistence"]
    read_args: ["--permission-mode", "plan"]
    write_args: ["--permission-mode", "acceptEdits"]
    model_args: ["--model", "{model}"]
    effort_args: ["--effort", "{effort}"]
    prompt_args: []
    dangerous_args: ["--dangerously-skip-permissions"]
    known_models: [fable, opus, sonnet]
    detect:
      version: ["--version"]
      auth: ["auth", "status"]
      auth_ok_pattern: '"loggedIn":\s*true'
    rate_limit_patterns:
      - "usage limit"
      - "rate_limit"
      - "Claude AI usage limit reached"

  deepseek:
    command: claude
    billing: api
    verified: false
    parser: json
    prompt_via: stdin
    base_args: ["-p", "--output-format", "json", "--permission-prompts", "none", "--no-session-persistence"]
    read_args: ["--permission-mode", "plan"]
    write_args: ["--permission-mode", "acceptEdits"]
    model_args: ["--model", "{model}"]
    effort_args: []
    prompt_args: []
    env:
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
    env_from:
      ANTHROPIC_AUTH_TOKEN: DEEPSEEK_API_KEY
    env_remove: [ANTHROPIC_API_KEY]
    known_models: [deepseek-flash, deepseek-v4-pro]
    detect:
      version: ["--version"]
      auth_env: [DEEPSEEK_API_KEY]
    rate_limit_patterns:
      - "Insufficient Balance"
      - "\\b402\\b"

  codex:
    command: codex
    billing: subscription
    verified: true
    parser: jsonl
    prompt_via: stdin
    base_args: ["exec", "--json", "--color", "never", "--ephemeral"]
    read_args: ["--sandbox", "read-only"]
    write_args: ["--sandbox", "workspace-write"]
    model_args: ["--model", "{model}"]
    effort_args: ["-c", "model_reasoning_effort=\"{effort}\""]
    prompt_args: ["-"]
    dangerous_args: ["--dangerously-bypass-approvals-and-sandbox"]
    known_models: []
    detect:
      version: ["--version"]
      auth: ["login", "status"]
    rate_limit_patterns:
      - "usage limit"
      - "Rate limit reached"

  copilot:
    command: copilot
    billing: subscription
    verified: true
    parser: text
    prompt_via: arg
    base_args: ["--silent", "--no-color", "--no-ask-user", "--no-auto-update", "--allow-all-tools"]
    read_args: ["--deny-tool=write", "--deny-tool=shell"]
    write_args: ["--deny-tool=shell"]
    model_args: ["--model", "{model}"]
    effort_args: ["--reasoning-effort", "{effort}"]
    prompt_args: ["-p", "{prompt}"]
    dangerous_args: ["--allow-all"]
    known_models: [auto]
    detect:
      version: ["--version"]
      auth_env: [COPILOT_GITHUB_TOKEN, GH_TOKEN, GITHUB_TOKEN]
    rate_limit_patterns:
      - "quota"
      - "premium requests"
      - "AI credits"

  agy:
    command: agy
    billing: subscription
    verified: false
    parser: text
    prompt_via: arg
    pty: true
    base_args: ["--print-timeout", "{timeout_s}s"]
    read_args: ["--mode", "plan"]
    write_args: ["--mode", "accept-edits"]
    model_args: ["--model", "{model}"]
    effort_args: []
    prompt_args: ["-p", "{prompt}"]
    dangerous_args: ["--dangerously-skip-permissions"]
    models_command: ["models"]
    known_models: []
    detect:
      version: ["--version"]
      auth: ["models"]

rate_limit_patterns:
  - "rate limit"
  - "rate-limit"
  - "too many requests"
  - "\\b429\\b"
  - "quota exceeded"
  - "exceeded your current quota"
  - "usage limit reached"
  - "resource_exhausted"

tiers:
  1:
    - { agent: copilot, model: auto, effort: low }
    - { agent: claude, model: sonnet, effort: low }
    - { agent: deepseek, model: deepseek-flash, effort: "" }
  2:
    - { agent: codex, model: "", effort: medium }
    - { agent: claude, model: sonnet, effort: medium }
    - { agent: deepseek, model: deepseek-v4-pro, effort: "" }
  3:
    - { agent: claude, model: opus, effort: high }
    - { agent: codex, model: "", effort: high }
    - { agent: agy, model: "", effort: "" }
  4:
    - { agent: claude, model: opus, effort: max }
    - { agent: codex, model: "", effort: xhigh }

classifier:
  - { agent: deepseek, model: deepseek-flash, effort: "" }
  - { agent: claude, model: sonnet, effort: low }
  - { agent: copilot, model: auto, effort: low }

planner:
  - { agent: claude, model: opus, effort: high }
  - { agent: codex, model: "", effort: high }

profiles:
  cheap: { start_offset: -1, max_tier: 3, max_escalations: 1 }
  balanced: {}
  max: { start_offset: 3 }

execution:
  max_escalations: 2
  review_min_tier: 3
  cooldown_minutes: 30
  total_timeout_s: 1800
  idle_timeout_s: 300
  verify: []
  verify_timeout_s: 900
  verify_env: []

adaptive:
  enabled: true
  min_samples: 5

decompose:
  auto: false
  max_subtasks: 6
  max_parallel: 3
