name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: timonel-linux-x64
          - os: macos-latest
            name: timonel-macos-arm64
          - os: windows-latest
            name: timonel-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Build a single-file binary
        shell: bash
        run: |
          uv run --with pyinstaller pyinstaller --onefile --name timonel \
            --collect-data timonel --hidden-import timonel.demo_agent \
            src/timonel/__main__.py
          suffix=""; [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"
          mv "dist/timonel$suffix" "dist/${{ matrix.name }}"
      - name: Smoke test
        shell: bash
        run: |
          "dist/${{ matrix.name }}" --version
          "dist/${{ matrix.name }}" config validate src/timonel/default_routes.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  attach:
    if: github.event_name == 'release'
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          gh release upload "${{ github.event.release.tag_name }}" * --repo "${{ github.repository }}" --clobber

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/timonel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          tag="${{ github.event.release.tag_name }}"
          docker build -t "$image:${tag#v}" -t "$image:latest" .
          docker push "$image:${tag#v}"
          docker push "$image:latest"
