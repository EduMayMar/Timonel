changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New features
      labels: [enhancement]
    - title: Connectors
      labels: [connector, flag-drift]
    - title: Fixes
      labels: [bug]
    - title: Translations
      labels: [i18n]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
