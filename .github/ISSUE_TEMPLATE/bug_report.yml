name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `timonel doctor`
      description: Check that no secret appears before pasting.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant part of routes.yaml
      render: yaml
